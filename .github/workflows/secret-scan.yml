name: Tracked Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for exposed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run dependency-free secret scanner
        shell: bash
        run: |
          set -o pipefail
          python scripts/security/scan_tracked_secrets.py | tee secret-scan-report.txt

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: secret-scan-report.txt
          if-no-files-found: error
          retention-days: 3
